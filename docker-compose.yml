# Entorno de desarrollo local completo.
# Uso: `docker compose up` desde la raíz del repo.
#
# Servicios:
#   - postgres: base de datos Postgres 16 local (puerto 5432)
#   - backend:  API Fastify + TypeScript con hot-reload (puerto 8000)
#   - frontend: Vite + React con HMR (puerto 5173)
#
# Volúmenes montados permiten editar código en la máquina host y que
# los cambios se reflejen dentro de los contenedores sin reconstruir.

services:
  postgres:
    image: postgres:16-alpine
    container_name: cowork-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cowork}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cowork_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-cowork_dev}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/supabase/migrations:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cowork} -d ${POSTGRES_DB:-cowork_dev}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      target: dev
    container_name: cowork-backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      HOST: 0.0.0.0
      PORT: 8000
      LOG_LEVEL: debug
      DATABASE_URL: postgres://${POSTGRES_USER:-cowork}:${POSTGRES_PASSWORD:-cowork_dev_password}@postgres:5432/${POSTGRES_DB:-cowork_dev}
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
      - /app/node_modules  # anonymous volume: no pisar node_modules del contenedor
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      target: dev
    container_name: cowork-frontend
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ""  # vacío = usa el proxy de Vite hacia backend
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
    driver: local
